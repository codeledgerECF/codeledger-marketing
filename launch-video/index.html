<script>
// ── MP3 background music ────────────────────────────────────────────────────
// Plays music.mp3 on loop with a 2-second fade-in.
// Page only loads after user clicks Play in parent, satisfying autoplay policy.
(function () {
  var audio = new Audio('music.mp3');
  audio.loop = true;
  audio.volume = 0;
  audio.play().catch(function () {});   // best-effort; browser may still gate it

  // 2-second linear fade-in
  var target = 0.55;
  var steps  = 40;
  var step   = 0;
  var iv = setInterval(function () {
    step++;
    audio.volume = Math.min(target, (step / steps) * target);
    if (step >= steps) clearInterval(iv);
  }, 50);

  var muted = false;

  // ── Mute / unmute button ───────────────────────────────────────────────────
  var btn = document.createElement('button');
  btn.title = 'Toggle music';
  btn.innerHTML = '&#x1F50A;'; // 🔊
  btn.style.cssText = [
    'position:fixed', 'bottom:14px', 'left:14px', 'z-index:9999',
    'width:34px', 'height:34px', 'border-radius:50%',
    'background:rgba(255,255,255,0.10)', 'border:1px solid rgba(255,255,255,0.18)',
    'color:rgba(255,255,255,0.75)', 'font-size:14px', 'cursor:pointer',
    'display:flex', 'align-items:center', 'justify-content:center',
    'backdrop-filter:blur(6px)', '-webkit-backdrop-filter:blur(6px)',
    'transition:background 0.2s, opacity 0.2s', 'line-height:1',
    'padding:0',
  ].join(';');

  btn.addEventListener('mouseover', function () {
    btn.style.background = 'rgba(255,255,255,0.20)';
  });
  btn.addEventListener('mouseout', function () {
    btn.style.background = muted
      ? 'rgba(255,255,255,0.05)'
      : 'rgba(255,255,255,0.10)';
  });
  btn.addEventListener('click', function () {
    muted = !muted;
    audio.volume = muted ? 0 : target;
    btn.innerHTML = muted ? '&#x1F507;' : '&#x1F50A;'; // 🔇 / 🔊
    btn.style.opacity = muted ? '0.5' : '1';
    btn.style.background = 'rgba(255,255,255,0.10)';
  });

  document.body.appendChild(btn);
}());
</script>
